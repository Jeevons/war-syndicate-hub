name: CI/CD — war-syndicate-hub

on:
  push:
    branches: [prod, dev]
  pull_request:
    branches: [dev, prod]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Quality Checks (lint + types + tests)
  # ─────────────────────────────────────────────
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (latest)
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Setup Bun (latest)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript — vérification des types
        run: bun run type-check

      - name: ESLint — lint du code
        run: bun run lint

      - name: Vitest — tests unitaires & intégration
        run: bun run test

  # ─────────────────────────────────────────────
  # JOB 2 — Deploy Preview (PR vers dev)
  # ─────────────────────────────────────────────
  deploy-preview:
    name: Deploy Preview (Vercel)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (latest)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Deploy Preview to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          OUTPUT=$(bunx vercel@latest deploy --token="$VERCEL_TOKEN" --yes 2>&1) || true
          echo "$OUTPUT"
          DEPLOY_URL=$(echo "$OUTPUT" | grep -E '^https://[^ ]*\.vercel\.app' | tail -1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "⚠️ Déploiement Vercel échoué ou URL non trouvée — vérifier VERCEL_ORG_ID et VERCEL_PROJECT_ID"
            echo "url=" >> $GITHUB_OUTPUT
          else
            echo "url=${DEPLOY_URL}" >> $GITHUB_OUTPUT
          fi

      - name: Commenter la PR avec l'URL Preview
        if: steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Preview déployé :** ${{ steps.deploy.outputs.url }}`
            })

  # ─────────────────────────────────────────────
  # JOB 3 — Migrate Database (push sur prod)
  # ─────────────────────────────────────────────
  migrate:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

  # ─────────────────────────────────────────────
  # JOB 4 — Deploy Production (push sur prod)
  # ─────────────────────────────────────────────
  deploy-production:
    name: Deploy Production (Vercel)
    runs-on: ubuntu-latest
    needs: [quality, migrate]
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (latest)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Deploy Production to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: bunx vercel@latest deploy --prod --token="$VERCEL_TOKEN" --yes
