name: CI/CD — war-syndicate-hub

on:
  push:
    branches: [prod, dev]
  pull_request:
    branches: [dev]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Quality Checks (lint + types + tests)
  # ─────────────────────────────────────────────
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (latest)
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Setup Bun (latest)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript — vérification des types
        run: bun run type-check

      - name: ESLint — lint du code
        run: bun run lint

      - name: Vitest — tests unitaires & intégration
        run: bun run test

  # ─────────────────────────────────────────────
  # JOB 2 — Deploy Preview (PR vers dev)
  # ─────────────────────────────────────────────
  deploy-preview:
    name: Deploy Preview (Vercel)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (latest)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Deploy Preview to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          OUTPUT=$(bunx vercel@latest deploy --token="$VERCEL_TOKEN" --yes 2>&1)
          DEPLOY_URL=$(echo "$OUTPUT" | grep -E '^https://' | tail -1)
          echo "url=${DEPLOY_URL}" >> $GITHUB_OUTPUT

      - name: Commenter la PR avec l'URL Preview
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Preview déployé :** ${{ steps.deploy.outputs.url }}`
            })

  # ─────────────────────────────────────────────
  # JOB 3 — Deploy Production (push sur prod)
  # ─────────────────────────────────────────────
  deploy-production:
    name: Deploy Production (Vercel)
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (latest)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Deploy Production to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: bunx vercel@latest deploy --prod --token="$VERCEL_TOKEN" --yes
